<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shepherd</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #1e1a17;
      --muted: #6b665f;
      --card: #ffffff;
      --border: #d5cec2;
      --user: #eaf1e6;
      --assistant: #fbf7ee;
      --refused: #f4ecd9;
      --refused-fg: #5a4a1e;
      --error: #fbe7e5;
      --error-fg: #7a1c15;
      --danger: #a3241c;
      --link: #33528a;
      --code-bg: #eee9de;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
                   sans-serif;
      background: var(--bg); color: var(--fg);
      font-size: 15px; line-height: 1.5;
    }
    header {
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--card); display: flex; align-items: center; gap: 24px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em;
    }
    .mode-toggle {
      display: inline-flex; border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .mode-toggle label {
      padding: 6px 12px; cursor: pointer;
      background: transparent; user-select: none;
    }
    .mode-toggle input[type="radio"] { display: none; }
    .mode-toggle input[type="radio"]:checked + label {
      background: var(--fg); color: var(--bg);
    }
    .mode-explainer {
      color: var(--muted); font-size: 13px; flex: 1 1 auto;
    }
    #baseline-banner {
      display: none;
      background: var(--error); color: var(--error-fg);
      padding: 10px 20px; border-bottom: 2px solid var(--danger);
      font-weight: 600;
    }
    #baseline-banner.active { display: block; }
    #transcript {
      max-width: 820px; margin: 0 auto; padding: 20px;
      min-height: calc(100vh - 260px);
    }
    .turn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px 16px; margin: 12px 0;
    }
    .turn.user { background: var(--user); }
    .turn.assistant { background: var(--assistant); }
    .turn.assistant.refused { background: var(--refused); border-color: #d9c88c; }
    .turn.assistant.error { background: var(--error); border-color: #d5a49b; }
    .turn .role {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: 6px;
    }
    .turn .refused-pill {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      background: var(--refused-fg); color: var(--refused);
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      margin-right: 6px;
    }
    .turn .answer { white-space: pre-wrap; }
    .turn details {
      margin-top: 10px; font-size: 14px; color: var(--muted);
    }
    .turn details summary {
      cursor: pointer; padding: 4px 0; color: var(--link);
    }
    .turn details .passage {
      margin: 6px 0; padding: 6px 10px; background: var(--code-bg);
      border-radius: 4px; color: var(--fg);
    }
    .turn details .passage .ref {
      font-weight: 600; margin-right: 6px;
    }
    .turn .refs-line {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    .turn .provenance {
      margin-top: 8px; font-size: 11px; color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    #input-row {
      max-width: 820px; margin: 0 auto; padding: 0 20px 20px;
      display: flex; gap: 8px;
    }
    #input {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 6px; font: inherit; resize: vertical; min-height: 44px;
    }
    #send {
      padding: 10px 18px; border: 1px solid var(--fg); background: var(--fg);
      color: var(--bg); border-radius: 6px; cursor: pointer; font: inherit;
    }
    #send:disabled { opacity: .5; cursor: not-allowed; }
    footer {
      max-width: 820px; margin: 0 auto; padding: 12px 20px 30px;
      font-size: 11px; color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Shepherd</h1>
    <div class="mode-toggle" role="radiogroup" aria-label="Answer mode">
      <input type="radio" id="mode-grounded" name="mode" value="grounded" checked>
      <label for="mode-grounded">Grounded</label>
      <input type="radio" id="mode-baseline" name="mode" value="baseline">
      <label for="mode-baseline">Baseline</label>
    </div>
    <div class="mode-explainer">
      Grounded: retrieves BSB passages first, answers only from them.
      Baseline: no retrieval — the model answers from training memory alone.
    </div>
  </header>

  <div id="baseline-banner">
    &#9888; Ungrounded mode — citations may be fabricated.
    Use grounded mode for study; baseline exists to measure fabrication.
  </div>

  <div id="transcript"></div>

  <div id="input-row">
    <textarea id="input" placeholder="Ask a Bible-study question…"
              rows="2" autofocus></textarea>
    <button id="send">Send</button>
  </div>

  <footer id="footer">loading provenance…</footer>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const transcript = $("transcript");
const input = $("input");
const sendBtn = $("send");
const banner = $("baseline-banner");
const footer = $("footer");

function currentMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function updateBanner() {
  banner.classList.toggle("active", currentMode() === "baseline");
}
document.querySelectorAll('input[name="mode"]').forEach(r =>
  r.addEventListener("change", updateBanner));
updateBanner();

// ---------------------------------------------------------------------------
// Provenance footer from /meta
// ---------------------------------------------------------------------------

async function loadMeta() {
  try {
    const r = await fetch("/meta");
    const m = await r.json();
    const short = (s, n = 12) => s ? (s.slice(0, n) + "…") : "missing";
    footer.textContent =
      `model=${m.model} · ` +
      `baseline=${m.prompts.baseline.path.split("/").pop()} (${short(m.prompts.baseline.sha256)}) · ` +
      `grounded=${m.prompts.grounded.path.split("/").pop()} (${short(m.prompts.grounded.sha256)}) · ` +
      `corpus=${short(m.corpus_sha256)} · git=${short(m.git_sha, 8)} · ` +
      `threshold=${m.abstention_threshold} · k=${m.retrieval_k}`;
  } catch (e) {
    footer.textContent = `[meta unavailable: ${e.message}]`;
  }
}
loadMeta();

// ---------------------------------------------------------------------------
// SSE parser — we read the response body ourselves because EventSource
// does not support POST. Each frame ends with a blank line; each frame
// has an `event:` line and a `data:` line.
// ---------------------------------------------------------------------------

async function* readSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let event = null, data = null;
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data = line.slice(6);
      }
      if (event && data !== null) {
        try { yield { event, data: JSON.parse(data) }; }
        catch (e) { yield { event: "error",
                            data: { error: `parse error: ${e.message}`,
                                    stage: "client" } }; }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Transcript rendering
// ---------------------------------------------------------------------------

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addUserTurn(text) {
  const turn = el("div", "turn user");
  turn.appendChild(el("div", "role", "you"));
  turn.appendChild(el("div", "answer", text));
  transcript.appendChild(turn);
  transcript.scrollIntoView({ block: "end", behavior: "smooth" });
}

function addAssistantTurn(mode) {
  const turn = el("div", "turn assistant");
  turn.appendChild(el("div", "role", `shepherd · ${mode}`));
  const body = el("div", "answer", "");
  turn.appendChild(body);
  transcript.appendChild(turn);
  return { turn, body };
}

function renderPassages(turn, passagesEv) {
  if (passagesEv.abstained) {
    turn.classList.add("refused");
    const pill = el("span", "refused-pill", "refused");
    turn.querySelector(".role").prepend(pill);
    // Replace the empty answer body with the abstention reason so the
    // user sees an honest message rather than blank text.
    turn.querySelector(".answer").textContent =
      "Nothing in the corpus scored strongly enough for this question, " +
      "so Shepherd is declining to answer rather than guess.\n\n" +
      `Reason: ${passagesEv.abstention_reason}`;
    return;
  }
  const passages = passagesEv.passages || [];
  if (passages.length === 0) return;
  const details = el("details");
  const summary = el("summary", null,
    `Retrieved passages (${passages.length})`);
  details.appendChild(summary);
  for (const p of passages) {
    const div = el("div", "passage");
    const ref = el("span", "ref", `[${p.reference}]`);
    div.appendChild(ref);
    div.appendChild(document.createTextNode(" " + p.text));
    details.appendChild(div);
  }
  turn.appendChild(details);
}

function renderDone(turn, doneEv) {
  const refs = doneEv.refs_in_answer || [];
  if (refs.length > 0) {
    const line = el("div", "refs-line");
    const refStrs = refs.map(r => {
      let s = `${r.book} ${r.chapter}`;
      if (r.verse !== null && r.verse !== undefined) s += `:${r.verse}`;
      if (r.end_verse) s += `-${r.end_verse}`;
      return s;
    });
    line.textContent = `References extracted from answer: ${refStrs.join(", ")}`;
    turn.appendChild(line);
  }
  const p = doneEv.provenance || {};
  const short = (s, n = 12) => s ? (s.slice(0, n) + "…") : "missing";
  const prov = el("div", "provenance");
  prov.textContent =
    `mode=${p.mode} · model=${p.model} · ` +
    `prompt=${short(p.prompt_sha256)} · corpus=${short(p.corpus_sha256)}`;
  turn.appendChild(prov);
}

function renderError(turn, errEv) {
  turn.classList.remove("refused");
  turn.classList.add("error");
  turn.querySelector(".answer").textContent =
    `[${errEv.stage} error] ${errEv.error}`;
}

// ---------------------------------------------------------------------------
// Ask flow
// ---------------------------------------------------------------------------

async function ask(question, mode) {
  addUserTurn(question);
  const { turn, body } = addAssistantTurn(mode);
  sendBtn.disabled = true;
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode }),
    });
    if (!r.ok) {
      renderError(turn, { stage: "http", error: `${r.status} ${r.statusText}` });
      return;
    }
    for await (const { event, data } of readSSE(r)) {
      if (event === "passages") renderPassages(turn, data);
      else if (event === "token") body.textContent += data.text;
      else if (event === "done") renderDone(turn, data);
      else if (event === "error") renderError(turn, data);
    }
  } catch (e) {
    renderError(turn, { stage: "client", error: e.message });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function submit() {
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  ask(q, currentMode());
}
sendBtn.addEventListener("click", submit);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});
</script>
</body>
</html>
